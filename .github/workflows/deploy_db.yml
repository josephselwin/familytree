name: Deploy Database

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target Environment (dev, qa, prod)'
        required: true
        type: choice
        options:
          - dev
          - qa
          - prod

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Install SQL Tools (if missing)
        run: |
            # Ubuntu latest usually has sqlcmd (mssql-tools), verifying/installing just in case
            if ! command -v sqlcmd &> /dev/null; then
                curl https://packages.microsoft.com/keys/microsoft.asc | sudo apt-key add -
                curl https://packages.microsoft.com/config/ubuntu/22.04/prod.list | sudo tee /etc/apt/sources.list.d/msprod.list
                sudo apt-get update
                sudo apt-get install -y mssql-tools unixodbc-dev
                echo 'export PATH="$PATH:/opt/mssql-tools/bin"' >> ~/.bash_profile
                source ~/.bash_profile
            fi

      - name: Deploy to ${{ inputs.environment }}
        working-directory: ./azure
        run: |
          chmod +x deploy_db.sh
          # Add sqlcmd to PATH for this step explicitly if not in global path
          export PATH="$PATH:/opt/mssql-tools/bin"
          ./deploy_db.sh ${{ inputs.environment }}
